[project]
name = "boodschappenagent"
version = "0.1.0"
description = "End-to-end grocery automation: van recepten naar een gevulde AH-winkelwagen"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
    "pymupdf>=1.25.0",
    "anthropic>=0.45.0",
    "pillow>=11.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.42.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
menu = "boodschappenagent.cli.menu:main"
voorraad = "boodschappenagent.cli.voorraad:main"
digitize = "boodschappenagent.cli.digitize:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.14",
    "httpx>=0.28.0",
    "playwright>=1.50.0",
    "pytest-playwright>=0.7.2",
    "beautifulsoup4>=4.14.3",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: End-to-end tests met Playwright (require browser)",
]
filterwarnings = [
    "error",
    "ignore:websockets.legacy is deprecated:DeprecationWarning:websockets",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning:uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
