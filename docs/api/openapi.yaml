          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
              example:
                item_id: "item-040"
                ingredient_name: "avocado"
                quantity: 2
                unit: "stuks"
                checked: false
                source_recipes: []
                note: "Manually added"

  /shoppingLists/{list_id}/items/{item_id}:
    patch:
      operationId: updateShoppingListItem
      summary: Update an item
      description: |
        Change the quantity or mark as checked.
        Checked items are not included when sending to AH.
      tags: [Shopping Lists]
      parameters:
        - $ref: "#/components/parameters/ShoppingListId"
        - $ref: "#/components/parameters/ShoppingListItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShoppingListItemRequest"
            examples:
              check_off:
                summary: Check off item (already at home)
                value:
                  checked: true
              change_quantity:
                summary: Change quantity
                value:
                  quantity: 500
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteShoppingListItem
      summary: Remove an item from the list
      tags: [Shopping Lists]
      parameters:
        - $ref: "#/components/parameters/ShoppingListId"
        - $ref: "#/components/parameters/ShoppingListItemId"
      responses:
        "204":
          description: Item removed.
        "404":
          $ref: "#/components/responses/NotFound"

  /shoppingLists/{list_id}:sendToAH:
    post:
      operationId: sendShoppingListToAH
      summary: Send shopping list to Albert Heijn
      description: |
        For each unchecked item on the shopping list, finds the best matching
        AH product and adds it to an AH favorites list.

        Matching strategy per item:
        1. Search in reference list (previously ordered products)
        2. Search via AH product search API
        3. Mark as "not found" if no match

        Returns a report with the result per item.
      tags: [Shopping Lists]
      parameters:
        - $ref: "#/components/parameters/ShoppingListId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendToAHRequest"
            example:
              ah_list_name: "Week 7 groceries"
              reference_list_id: "existing-ah-list-id-123"
      responses:
        "200":
          description: Result of the AH integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendToAHResponse"
              example:
                ah_list_id: "new-ah-list-id-456"
                ah_list_name: "Week 7 groceries"
                total_items: 23
                matched: 21
                not_found: 2
                results:
                  - ingredient_name: "runderstoofvlees"
                    status: "matched"
                    source: "search"
                    ah_product:
                      product_id: 12345
                      title: "AH Runderstoofvlees"
                      brand: "AH"
                      size: "400 g"
                      price: 5.99
                    quantity: 1
                  - ingredient_name: "eieren"
                    status: "matched"
                    source: "reference"
                    ah_product:
                      product_id: 67890
                      title: "AH Scharreleieren"
                      brand: "AH"
                      size: "10 stuks"
                      price: 3.49
                    quantity: 1
                  - ingredient_name: "venkelknol"
                    status: "not_found"
                    source: "none"
                    ah_product: null
                    quantity: 0
        "401":
          description: Not logged in to Albert Heijn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 401
                status: "UNAUTHENTICATED"
                message: "Not logged in to Albert Heijn. Use POST /v1/ah:login."
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # AH Integration
  # =========================================================================

  /ah:login:
    post:
      operationId: ahLogin
      summary: Log in to Albert Heijn
      description: |
        Exchange an OAuth2 authorization code for access and refresh tokens.

        Step 1: Open the login URL in a browser:
        ```
        https://login.ah.nl/secure/oauth/authorize?client_id=appie&redirect_uri=appie://login-exit&response_type=code
        ```

        Step 2: Log in with your AH account. After redirect, copy the `code`
        parameter from the URL.

        Step 3: Send the code to this endpoint.

        Tokens are automatically refreshed (valid ~2 hours, auto-refresh).
      tags: [AH Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AHLoginRequest"
            example:
              authorization_code: "abc123def456"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AHLoginResponse"
              example:
                authenticated: true
                expires_at: "2026-02-14T21:30:00Z"
                message: "Login successful. Tokens saved."
        "400":
          description: Invalid authorization code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 400
                status: "INVALID_ARGUMENT"
                message: "Invalid or expired authorization code."

  /ah/status:
    get:
      operationId: getAHStatus
      summary: Check AH authentication status
      description: Checks whether valid AH tokens are present.
      tags: [AH Integration]
      responses:
        "200":
          description: Authentication status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AHStatusResponse"
              examples:
                logged_in:
                  summary: Logged in
                  value:
                    authenticated: true
                    expires_at: "2026-02-14T21:30:00Z"
                not_logged_in:
                  summary: Not logged in
                  value:
                    authenticated: false
                    expires_at: null
                    login_url: "https://login.ah.nl/secure/oauth/authorize?client_id=appie&redirect_uri=appie://login-exit&response_type=code"

  /ah/products:search:
    post:
      operationId: searchAHProducts
      summary: Search AH products
      description: |
        Search products in the Albert Heijn catalog.
        Optionally search in a reference list first (previously ordered products).
      tags: [AH Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchAHProductsRequest"
            example:
              query: "spaghetti"
              limit: 5
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAHProductsResponse"
              example:
                products:
                  - product_id: 11111
                    title: "AH Spaghetti"
                    brand: "AH"
                    size: "500 g"
                    price: 0.89
                    category: "Pasta, rijst en wereldkeuken"
                    is_orderable: true
                  - product_id: 22222
                    title: "De Cecco Spaghetti No.12"
                    brand: "De Cecco"
                    size: "500 g"
                    price: 2.29
                    category: "Pasta, rijst en wereldkeuken"
                    is_orderable: true
                  - product_id: 33333
                    title: "AH Volkoren spaghetti"
                    brand: "AH"
                    size: "500 g"
                    price: 1.09
                    category: "Pasta, rijst en wereldkeuken"
                    is_orderable: true
                total_size: 3
        "401":
          description: Not logged in to Albert Heijn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ah/lists:
    get:
      operationId: listAHLists
      summary: List AH favorites lists
      tags: [AH Integration]
      responses:
        "200":
          description: List of AH lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAHListsResponse"
              example:
                lists:
                  - list_id: "ah-list-123"
                    name: "Week 6 groceries"
                    total_items: 18
                  - list_id: "ah-list-456"
                    name: "Standard groceries"
                    total_items: 25
                total_size: 2
        "401":
          description: Not logged in to Albert Heijn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: createAHList
      summary: Create a new AH list
      tags: [AH Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAHListRequest"
            example:
              name: "Week 7 groceries"
      responses:
        "201":
          description: The created list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AHList"
              example:
                list_id: "ah-list-789"
                name: "Week 7 groceries"
                total_items: 0
        "401":
          description: Not logged in to Albert Heijn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ah/lists/{ah_list_id}:
    get:
      operationId: getAHList
      summary: Get an AH list with products
      tags: [AH Integration]
      parameters:
        - name: ah_list_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The AH list with product details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AHListWithProducts"
              example:
                list_id: "ah-list-123"
                name: "Week 6 groceries"
                total_items: 3
                products:
                  - product_id: 11111
                    title: "AH Spaghetti"
                    brand: "AH"
                    size: "500 g"
                    price: 0.89
                    quantity: 1
                  - product_id: 67890
                    title: "AH Scharreleieren"
                    brand: "AH"
                    size: "10 stuks"
                    price: 3.49
                    quantity: 1
                  - product_id: 12345
                    title: "AH Runderstoofvlees"
                    brand: "AH"
                    size: "400 g"
                    price: 5.99
                    quantity: 1
        "401":
          description: Not logged in to Albert Heijn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # Today (Cooking Mode)
  # =========================================================================

  /today:
    get:
      operationId: getToday
      summary: Get today's recipe
      description: |
        Returns the day planning for today from the most recent (confirmed)
        weekly menu. Includes the full recipe with ingredients, scaled
        to the number of portions.

        If there is no menu for today, returns an empty response.
      tags: [Today]
      parameters:
        - name: date
          in: query
          description: |
            Optional: view the recipe for a different date.
            Format: YYYY-MM-DD. Default: today.
          schema:
            type: string
            format: date
          example: "2026-02-14"
      responses:
        "200":
          description: Today's recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
              examples:
                with_recipe:
                  summary: Day with a recipe
                  value:
                    date: "2026-02-14"
                    day_label: "zaterdag"
                    has_recipe: true
                    menu_id: "2026-W07"
                    day:
                      name: "menus/2026-W07/days/5"
                      day: 5
                      day_label: "zaterdag"
                      date: "2026-02-14"
                      type: "recipe"
                      portions: 4
                      recipe:
                        name: "recipes/thaise-roerbak-met-kip-en-homemade-satesaus"
                        recipe_id: "thaise-roerbak-met-kip-en-homemade-satesaus"
                        display_name: "Thaise roerbak met kip en homemade satesaus"
                        category: "gevogelte"
                        base: "rijst"
                        seasons: ["alle"]
                        base_portions: 4
                        ingredients:
                          - ingredient_name: "kipfilet"
                            quantity: 400
                            unit: "gram"
                          - ingredient_name: "noedels"
                            quantity: 300
                            unit: "gram"
                          - ingredient_name: "pindakaas"
                            quantity: 3
                            unit: "eetlepel"
                          - ingredient_name: "sojasaus"
                            quantity: 2
                            unit: "eetlepel"
                          - ingredient_name: "knoflook"
                            quantity: 2
                            unit: "teen"
                        tags: ["aziatisch", "kip"]
                        prep_time_minutes: 25
                        instructions: "1. Snijd de kip in reepjes..."
                        source: "Kookboek p. 67"
                    previous_date: "2026-02-13"
                    next_date: "2026-02-15"
                hellofresh_day:
                  summary: HelloFresh day
                  value:
                    date: "2026-02-10"
                    day_label: "dinsdag"
                    has_recipe: false
                    menu_id: "2026-W07"
                    day:
                      name: "menus/2026-W07/days/1"
                      day: 1
                      day_label: "dinsdag"
                      date: "2026-02-10"
                      type: "hellofresh"
                      portions: 0
                      recipe: null
                    previous_date: "2026-02-09"
                    next_date: "2026-02-11"
                no_menu:
                  summary: No menu for this date
                  value:
                    date: "2026-03-01"
                    day_label: "zondag"
                    has_recipe: false
                    menu_id: null
                    day: null
                    previous_date: "2026-02-28"
                    next_date: "2026-03-02"

  # =========================================================================
