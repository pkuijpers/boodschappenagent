  /inventory:generateChecks:
    post:
      operationId: generateInventoryChecks
      summary: Generate inventory check suggestions
      description: |
        Generates a sorted list of suggestions for the inventory check,
        based on the weekly menu and the season.

        Priorities:
        - **high**: Fresh staple products (always check)
        - **medium**: Shelf-stable products used in the weekly menu
        - **low**: Seasonal products
