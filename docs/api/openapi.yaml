                checks:
                  - item_name: "melk"
                    reason: "Fresh staple — check weekly"
                    priority: "high"
                    type: "vers_basis"
                    current_status: true
                  - item_name: "eieren"
                    reason: "Fresh staple — check weekly"
                    priority: "high"
                    type: "vers_basis"
                    current_status: false
                  - item_name: "boter"
                    reason: "Fresh staple — check weekly"
                    priority: "high"
                    type: "vers_basis"
                    current_status: true
                  - item_name: "kaas"
                    reason: "Fresh staple — check weekly"
                    priority: "high"
                    type: "vers_basis"
                    current_status: true
                  - item_name: "passata"
                    reason: "Used in weekly menu"
                    priority: "medium"
                    type: "houdbaar"
                    current_status: true
                    used_in_recipes:
