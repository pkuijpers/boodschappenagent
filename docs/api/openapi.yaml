openapi: 3.1.0
info:
  title: Boodschappenagent API
  version: v1
  description: |
    REST API for the Boodschappenagent (grocery agent) system: automatically plan
    weekly menus, generate shopping lists, track inventory, and order at Albert Heijn.

    ## Design Principles

    This API follows the [Google API Design Guide](https://google.aip.dev):

    - **Resource-oriented design**: All functionality is modeled as resources
      with standard CRUD operations (List, Get, Create, Update, Delete).
    - **Custom methods**: Non-CRUD operations use `POST` with `:verb` suffix
      (e.g., `POST /v1/menus:generate`).
    - **snake_case**: All field names use snake_case.
    - **Pagination**: Collections support `page_size` and `page_token`.
    - **Standard error codes**: HTTP status codes per Google API conventions.

    ## Weekly Flow

    The API supports the following user flow:

    1. **Generate menu** — `POST /v1/menus:generate`
    2. **Replace recipes** — `POST /v1/menus/{menu}/days/{day}:replaceRecipe`
    3. **Shuffle entire week** — `POST /v1/menus/{menu}:shuffle`
    4. **Inventory check** — `POST /v1/inventory:generateChecks` + `POST /v1/inventory/items:batchUpdate`
    5. **Shopping list** — `POST /v1/shoppingLists:generate`
    6. **Send to AH** — `POST /v1/shoppingLists/{shopping_list}:sendToAH`

    ## Cooking Mode

    Retrieve today's recipe: `GET /v1/today`

    ## Domain Values

    Category, base, and season enum values use Dutch terms to match
    the recipe data (e.g., `vlees`, `gevogelte`, `rijst`, `winter`).

  contact:
    name: Boodschappenagent
  license:
    name: Private

servers:
  - url: http://localhost:8000/v1
    description: Local development server

tags:
  - name: Recipes
    description: Recipe database — all recipes with ingredients, seasons, and metadata.
  - name: Menus
    description: |
      Weekly menus — automatically generated or manually composed.
      Each menu contains day plans with recipes and portion counts.
  - name: Inventory
    description: |
      Inventory management — track which shelf-stable and fresh staple products
      are in stock. Generates check suggestions based on the weekly menu.
  - name: Shopping Lists
    description: |
      Shopping lists — aggregated ingredients from the weekly menu,
      filtered by inventory, with manual additions.
  - name: AH Integration
    description: |
      Albert Heijn integration — OAuth2 authentication, product search,
      list management, and sending groceries to AH.
  - name: Today
    description: Cooking mode — today's recipe.
  - name: Settings
    description: User settings.

# ===========================================================================
# Paths
# ===========================================================================
paths:

  # =========================================================================
  # Recipes
  # =========================================================================

  /recipes:
    get:
      operationId: listRecipes
      summary: List all recipes
      description: |
        Returns all recipes, optionally filtered by season, category,
        tags, or search term. Supports pagination.

        Filter parameters can be combined (AND logic).
      tags: [Recipes]
      parameters:
        - name: page_size
          in: query
          description: Maximum number of results per page.
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: page_token
          in: query
          description: Token for the next page (from previous response).
          schema:
            type: string
        - name: filter.season
          in: query
          description: |
            Filter by season. Recipes with season `alle` (all) are always included.
          schema:
            $ref: "#/components/schemas/Season"
        - name: filter.category
          in: query
          description: Filter by category (protein source).
          schema:
            $ref: "#/components/schemas/Category"
        - name: filter.base
          in: query
          description: Filter by carbohydrate base.
          schema:
            $ref: "#/components/schemas/Base"
        - name: filter.tags
          in: query
          description: |
            Filter by tags. Separate multiple tags with commas.
            Default AND logic (recipe must have all tags).
          schema:
            type: string
          example: "spaans,kip"
        - name: filter.tags_match
          in: query
          description: How tags are combined.
          schema:
            type: string
            enum: [all, any]
            default: all
        - name: search
          in: query
          description: |
            Search term for fuzzy matching on recipe name.
            Also finds recipes with small typos.
          schema:
            type: string
          example: "spagheti"
        - name: order_by
          in: query
          description: |
            Sort field. Prefix with `-` for descending.
            Default: alphabetical by display_name.
          schema:
            type: string
            enum: [display_name, -display_name, prep_time_minutes, -prep_time_minutes, last_cooked, -last_cooked]
            default: display_name
      responses:
        "200":
          description: List of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRecipesResponse"
              example:
                recipes:
                  - name: "recipes/spaanse-rijstschotel-chorizo-kip"
                    recipe_id: "spaanse-rijstschotel-chorizo-kip"
                    display_name: "Spaanse rijstschotel met chorizo en kip"
                    category: "gevogelte"
                    base: "rijst"
                    seasons: ["alle"]
                    base_portions: 4
                    ingredients:
                      - ingredient_name: "notenrijst"
                        quantity: 275
                        unit: "gram"
                      - ingredient_name: "cherrytomaten"
                        quantity: 250
                        unit: "gram"
                      - ingredient_name: "chorizo"
                        quantity: 100
                        unit: "gram"
                      - ingredient_name: "kipfiletblokjes"
                        quantity: 1
                        unit: "stuks"
                        note: "duopak"
                    tags: ["spaans", "kip"]
                    prep_time_minutes: 25
                    source: "AH Allerhande Box"
                    last_cooked: "2026-01-15"
                    times_cooked: 5
                  - name: "recipes/spaghetti-bolognese"
                    recipe_id: "spaghetti-bolognese"
                    display_name: "Spaghetti Bolognese"
                    category: "vlees"
                    base: "pasta"
                    seasons: ["alle"]
                    base_portions: 2
                    ingredients:
                      - ingredient_name: "spaghetti"
                        quantity: 250
                        unit: "gram"
                      - ingredient_name: "rundergehakt"
                        quantity: 250
                        unit: "gram"
                      - ingredient_name: "passata"
                        quantity: 400
                        unit: "gram"
                      - ingredient_name: "ui"
                        quantity: 1
                        unit: "stuks"
                    tags: ["italiaans", "pasta"]
                    prep_time_minutes: 30
                    source: "Kookboek p. 12"
                next_page_token: ""
                total_size: 30

  /recipes/{recipe_id}:
    get:
      operationId: getRecipe
      summary: Get a recipe
      description: Returns a single recipe with all details.
      tags: [Recipes]
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - name: portions
          in: query
          description: |
            Optional: scale ingredients to this number of portions.
            If omitted, base portions are used.
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
              example:
                name: "recipes/spaanse-rijstschotel-chorizo-kip"
                recipe_id: "spaanse-rijstschotel-chorizo-kip"
                display_name: "Spaanse rijstschotel met chorizo en kip"
                category: "gevogelte"
                base: "rijst"
                seasons: ["alle"]
                base_portions: 4
                ingredients:
                  - ingredient_name: "notenrijst"
                    quantity: 275
                    unit: "gram"
                  - ingredient_name: "paprikamix"
                    quantity: 3
                    unit: "stuks"
                  - ingredient_name: "cherrytomaten"
                    quantity: 250
                    unit: "gram"
                  - ingredient_name: "chorizo"
                    quantity: 100
                    unit: "gram"
                  - ingredient_name: "kipfiletblokjes"
                    quantity: 1
                    unit: "stuks"
                    note: "duopak"
                  - ingredient_name: "komijn"
                    quantity: 2
                    unit: "stuks"
                    note: "sachets"
                  - ingredient_name: "peterselie"
                    quantity: 15
                    unit: "gram"
                  - ingredient_name: "peper"
                    quantity: 1
                    unit: "naar smaak"
                  - ingredient_name: "zout"
                    quantity: 1
                    unit: "naar smaak"
                tags: ["spaans", "kip"]
                prep_time_minutes: 25
                instructions: "1. Breng een ruime pan water met eventueel zout aan de kook..."
                source: "AH Allerhande Box"
                last_cooked: "2026-01-15"
                times_cooked: 5
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateRecipe
      summary: Update a recipe
      description: |
        Update fields of an existing recipe. Only provided fields
        are changed (merge semantics).
      tags: [Recipes]
      parameters:
        - $ref: "#/components/parameters/RecipeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdate"
            example:
              display_name: "Spaanse rijstschotel met chorizo en kip (aangepast)"
              prep_time_minutes: 30
              tags: ["spaans", "kip", "one-pot"]
      responses:
        "200":
          description: The updated recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteRecipe
      summary: Delete a recipe
      tags: [Recipes]
      parameters:
        - $ref: "#/components/parameters/RecipeId"
      responses:
        "204":
          description: Recipe deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # Menus
  # =========================================================================

  /menus:
    get:
      operationId: listMenus
      summary: List weekly menus
      description: |
        Returns saved weekly menus, sorted by date (newest first).
        Includes both confirmed menus (in history) and draft menus.
      tags: [Menus]
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
            maximum: 52
        - name: page_token
          in: query
          schema:
            type: string
        - name: filter.status
          in: query
          description: Filter by menu status.
          schema:
            type: string
            enum: [draft, confirmed]
      responses:
        "200":
          description: List of weekly menus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMenusResponse"
              example:
                menus:
                  - name: "menus/2026-W07"
                    menu_id: "2026-W07"
                    week_start: "2026-02-09"
                    status: "draft"
                    days:
                      - day: 0
                        day_label: "maandag"
                        date: "2026-02-09"
                        recipe_id: "spaanse-rijstschotel-chorizo-kip"
                        recipe_display_name: "Spaanse rijstschotel met chorizo en kip"
                        recipe_category: "gevogelte"
                        recipe_base: "rijst"
                        portions: 2
                        type: "recipe"
                        last_cooked: "2026-01-15"
                      - day: 1
                        day_label: "dinsdag"
                        date: "2026-02-10"
                        type: "hellofresh"
                        portions: 0
                      - day: 2
                        day_label: "woensdag"
                        date: "2026-02-11"
                        type: "hellofresh"
                        portions: 0
                      - day: 3
                        day_label: "donderdag"
                        date: "2026-02-12"
                        type: "hellofresh"
                        portions: 0
                      - day: 4
                        day_label: "vrijdag"
                        date: "2026-02-13"
                        recipe_id: "zalm-teriyaki"
                        recipe_display_name: "Zalm teriyaki"
                        recipe_category: "vis"
                        recipe_base: "rijst"
                        portions: 2
                        type: "recipe"
                        last_cooked: "2025-12-20"
                      - day: 5
                        day_label: "zaterdag"
                        date: "2026-02-14"
                        recipe_id: "kip-tandoori"
                        recipe_display_name: "Kip tandoori"
                        recipe_category: "gevogelte"
                        recipe_base: "rijst"
                        portions: 4
                        type: "recipe"
                        last_cooked: "2025-12-28"
                      - day: 6
                        day_label: "zondag"
                        date: "2026-02-15"
                        recipe_id: "moussaka"
                        recipe_display_name: "Moussaka"
                        recipe_category: "vlees"
                        recipe_base: "aardappel"
                        portions: 4
                        type: "recipe"
                        last_cooked: "2025-12-31"
                next_page_token: ""
                total_size: 1

  /menus:generate:
    post:
      operationId: generateMenu
      summary: Generate a weekly menu
      description: |
        Automatically generates a weekly menu using the MenuPlanner.
        Takes into account:
        - Current season
        - Category and base variety (no repeats back-to-back)
        - Recently cooked recipes (no repeat within 3 weeks)
        - HelloFresh days (no recipe needed)
        - Default portions (weekdays 2p, weekends 4p)
      tags: [Menus]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateMenuRequest"
            examples:
              standard_week:
                summary: Standard week — 4 cooking days, 3x HelloFresh
                value:
                  week_start: "2026-02-09"
                  season: "winter"
                  days:
                    - day: 0
                      portions: 2
                      type: "recipe"
                    - day: 1
                      type: "hellofresh"
                    - day: 2
                      type: "hellofresh"
                    - day: 3
                      type: "hellofresh"
                    - day: 4
                      portions: 2
                      type: "recipe"
                    - day: 5
                      portions: 4
                      type: "recipe"
                    - day: 6
                      portions: 4
                      type: "recipe"
              busy_week:
                summary: Busy week — only weekend cooking
                value:
                  week_start: "2026-02-16"
                  season: "winter"
                  days:
                    - day: 0
                      type: "not_home"
                    - day: 1
                      type: "hellofresh"
                    - day: 2
                      type: "hellofresh"
                    - day: 3
                      type: "hellofresh"
                    - day: 4
                      type: "not_home"
                    - day: 5
                      portions: 4
                      type: "recipe"
                    - day: 6
                      portions: 4
                      type: "recipe"
              summer_week:
                summary: Summer week — light dishes
                value:
                  week_start: "2026-06-22"
                  season: "zomer"
                  days:
                    - day: 0
                      portions: 2
                      type: "recipe"
                    - day: 1
                      type: "hellofresh"
                    - day: 2
                      type: "hellofresh"
                    - day: 3
                      type: "hellofresh"
                    - day: 4
                      portions: 2
                      type: "recipe"
                    - day: 5
                      portions: 2
                      type: "recipe"
                    - day: 6
                      portions: 2
                      type: "recipe"
      responses:
        "200":
          description: The generated weekly menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
              example:
                name: "menus/2026-W07"
                menu_id: "2026-W07"
                week_start: "2026-02-09"
                status: "draft"
                season: "winter"
                days:
                  - day: 0
                    day_label: "maandag"
                    date: "2026-02-09"
                    recipe_id: "italiaanse-runderstoof-met-pompoen"
                    recipe_display_name: "Italiaanse runderstoof met pompoen"
                    recipe_category: "vlees"
                    recipe_base: "aardappel"
                    portions: 2
                    type: "recipe"
                    last_cooked: "2025-11-20"
                  - day: 1
                    day_label: "dinsdag"
                    date: "2026-02-10"
                    type: "hellofresh"
                    portions: 0
                  - day: 2
                    day_label: "woensdag"
                    date: "2026-02-11"
                    type: "hellofresh"
                    portions: 0
                  - day: 3
                    day_label: "donderdag"
                    date: "2026-02-12"
                    type: "hellofresh"
                    portions: 0
                  - day: 4
                    day_label: "vrijdag"
                    date: "2026-02-13"
                    recipe_id: "vis-teriyaki-met-noedels-en-cashewhoten"
                    recipe_display_name: "Vis teriyaki met noedels en cashewnoten"
                    recipe_category: "vis"
                    recipe_base: "pasta"
                    portions: 2
                    type: "recipe"
                    last_cooked: "2025-12-06"
                  - day: 5
                    day_label: "zaterdag"
                    date: "2026-02-14"
                    recipe_id: "thaise-roerbak-met-kip-en-homemade-satesaus"
                    recipe_display_name: "Thaise roerbak met kip en homemade satesaus"
                    recipe_category: "gevogelte"
                    recipe_base: "rijst"
                    portions: 4
                    type: "recipe"
                    last_cooked: "2025-12-15"
                  - day: 6
                    day_label: "zondag"
                    date: "2026-02-15"
                    recipe_id: "winterse-pompoenquiche"
                    recipe_display_name: "Winterse pompoenquiche"
                    recipe_category: "vegetarisch"
                    recipe_base: "brood"
                    portions: 4
                    type: "recipe"
                    last_cooked: "2025-11-30"
        "400":
          $ref: "#/components/responses/BadRequest"

  /menus/{menu_id}:
    get:
      operationId: getMenu
      summary: Get a weekly menu
      tags: [Menus]
      parameters:
        - $ref: "#/components/parameters/MenuId"
      responses:
        "200":
          description: The weekly menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteMenu
      summary: Delete a weekly menu
      tags: [Menus]
      parameters:
        - $ref: "#/components/parameters/MenuId"
      responses:
        "204":
          description: Menu deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /menus/{menu_id}:shuffle:
    post:
      operationId: shuffleMenu
      summary: Shuffle the entire weekly menu
      description: |
        Generates a completely new weekly menu to replace the current one.
        Preserves the day configuration (portions, HelloFresh days) but selects
        new recipes. The old proposal is overwritten.
      tags: [Menus]
      parameters:
        - $ref: "#/components/parameters/MenuId"
      responses:
        "200":
          description: The new weekly menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
              example:
                name: "menus/2026-W07"
                menu_id: "2026-W07"
                week_start: "2026-02-09"
                status: "draft"
                season: "winter"
                days:
                  - day: 0
                    day_label: "maandag"
                    date: "2026-02-09"
                    recipe_id: "zuurkoolschotel-met-ham-en-crunchy-spek"
                    recipe_display_name: "Zuurkoolschotel met ham en crunchy spek"
                    recipe_category: "vlees"
                    recipe_base: "aardappel"
                    portions: 2
                    type: "recipe"
                    last_cooked: "2025-11-10"
                  - day: 1
                    day_label: "dinsdag"
                    date: "2026-02-10"
                    type: "hellofresh"
                    portions: 0
                  - day: 2
                    day_label: "woensdag"
                    date: "2026-02-11"
                    type: "hellofresh"
                    portions: 0
                  - day: 3
                    day_label: "donderdag"
                    date: "2026-02-12"
                    type: "hellofresh"
                    portions: 0
                  - day: 4
                    day_label: "vrijdag"
                    date: "2026-02-13"
                    recipe_id: "hollandse-rijstschotel-met-warmgerookte-zalm"
                    recipe_display_name: "Hollandse rijstschotel met warmgerookte zalm"
                    recipe_category: "vis"
                    recipe_base: "rijst"
                    portions: 2
                    type: "recipe"
                    last_cooked: "2025-12-01"
                  - day: 5
                    day_label: "zaterdag"
                    date: "2026-02-14"
                    recipe_id: "enchiladas-met-gerookte-kip-cheddar-champignons"
                    recipe_display_name: "Enchiladas met gerookte kip, cheddar en champignons"
                    recipe_category: "gevogelte"
                    recipe_base: "brood"
                    portions: 4
                    type: "recipe"
                    last_cooked: "2025-10-20"
                  - day: 6
                    day_label: "zondag"
                    date: "2026-02-15"
                    recipe_id: "pompoensoep-met-selderijrolie-eikruim-en-naanbrood"
                    recipe_display_name: "Pompoensoep met selderijrolie, eikruim en naanbrood"
                    recipe_category: "vegetarisch"
                    recipe_base: "brood"
                    portions: 4
                    type: "recipe"
                    last_cooked: "2025-11-25"
        "404":
          $ref: "#/components/responses/NotFound"

  /menus/{menu_id}:confirm:
    post:
      operationId: confirmMenu
      summary: Confirm the weekly menu
      description: |
        Confirms the weekly menu and saves it to the menu history.
        After confirmation, the recipes are included in the "recently cooked"
        calculation for future menu generation.
      tags: [Menus]
      parameters:
        - $ref: "#/components/parameters/MenuId"
      responses:
        "200":
          description: The confirmed menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
              example:
                name: "menus/2026-W07"
                menu_id: "2026-W07"
                week_start: "2026-02-09"
                status: "confirmed"
                season: "winter"
                days:
                  - day: 0
                    day_label: "maandag"
                    date: "2026-02-09"
                    recipe_id: "italiaanse-runderstoof-met-pompoen"
                    recipe_display_name: "Italiaanse runderstoof met pompoen"
                    recipe_category: "vlees"
                    recipe_base: "aardappel"
                    portions: 2
                    type: "recipe"
                    last_cooked: "2026-02-09"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Menu is already confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: 409
                status: "ALREADY_EXISTS"
                message: "Menu 2026-W07 is already confirmed."

  # -------------------------------------------------------------------------
  # Menu Days
  # -------------------------------------------------------------------------

  /menus/{menu_id}/days/{day}:
    get:
      operationId: getMenuDay
      summary: Get day planning
      description: |
        Returns the planning for a specific day, including the full recipe
        with ingredients (scaled to the specified number of portions).
      tags: [Menus]
      parameters:
        - $ref: "#/components/parameters/MenuId"
        - $ref: "#/components/parameters/DayNumber"
      responses:
        "200":
          description: The day planning with full recipe details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuDay"
              examples:
                recipe_day:
                  summary: Day with recipe
                  value:
                    name: "menus/2026-W07/days/0"
                    day: 0
                    day_label: "maandag"
                    date: "2026-02-09"
                    type: "recipe"
                    portions: 2
                    recipe:
                      name: "recipes/italiaanse-runderstoof-met-pompoen"
                      recipe_id: "italiaanse-runderstoof-met-pompoen"
                      display_name: "Italiaanse runderstoof met pompoen"
                      category: "vlees"
                      base: "aardappel"
                      seasons: ["herfst", "winter"]
                      base_portions: 2
                      ingredients:
                        - ingredient_name: "runderstoofvlees"
                          quantity: 300
                          unit: "gram"
                        - ingredient_name: "pompoen"
                          quantity: 300
                          unit: "gram"
                        - ingredient_name: "passata"
                          quantity: 400
                          unit: "gram"
                        - ingredient_name: "ui"
                          quantity: 1
                          unit: "stuks"
                      tags: ["italiaans", "stoofgerecht"]
                      prep_time_minutes: 90
                      instructions: "1. Snijd het vlees in blokjes..."
                      source: "Kookboek p. 34"
                    last_cooked: "2025-11-20"
                hellofresh_day:
                  summary: HelloFresh day
                  value:
                    name: "menus/2026-W07/days/1"
                    day: 1
                    day_label: "dinsdag"
                    date: "2026-02-10"
                    type: "hellofresh"
