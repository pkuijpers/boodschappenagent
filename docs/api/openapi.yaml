# ===========================================================================
# Components
# ===========================================================================
components:

  # =========================================================================
  # Parameters
  # =========================================================================
  parameters:
    RecipeId:
      name: recipe_id
      in: path
      required: true
      description: "Recipe slug ID (e.g., `spaanse-rijstschotel-chorizo-kip`)."
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      example: "spaanse-rijstschotel-chorizo-kip"

    MenuId:
      name: menu_id
      in: path
      required: true
      description: "Menu ID in ISO week format (e.g., `2026-W07`)."
      schema:
        type: string
        pattern: "^\\d{4}-W\\d{2}$"
      example: "2026-W07"

    DayNumber:
      name: day
      in: path
      required: true
      description: "Day of week as number: 0=Monday, 6=Sunday."
      schema:
        type: integer
        minimum: 0
        maximum: 6
      example: 0

    InventoryItemName:
      name: item_name
      in: path
      required: true
      description: "Normalized name of the inventory item."
      schema:
        type: string
      example: "pasta"

    ShoppingListId:
      name: list_id
      in: path
      required: true
      description: "Shopping list ID (e.g., `2026-W07`)."
      schema:
        type: string
      example: "2026-W07"

    ShoppingListItemId:
      name: item_id
      in: path
      required: true
      description: "Unique item ID within the shopping list."
      schema:
        type: string
      example: "item-001"

  # =========================================================================
  # Responses
  # =========================================================================
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            status: "NOT_FOUND"
            message: "The requested resource does not exist."

    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 400
            status: "INVALID_ARGUMENT"
            message: "Invalid request. Check the parameters."

  # =========================================================================
  # Schemas
  # =========================================================================
  schemas:

    # -----------------------------------------------------------------------
    # Enums
    # -----------------------------------------------------------------------

    Season:
      type: string
      description: |
        Season for recipe filtering. Values are in Dutch to match recipe data.
        - `lente` — Spring
        - `zomer` — Summer
        - `herfst` — Autumn
        - `winter` — Winter
        - `alle` — All seasons
      enum: [lente, zomer, herfst, winter, alle]
      example: "winter"

    Category:
      type: string
      description: |
        Recipe category based on protein source. Values are in Dutch.
        - `vlees` — Meat (beef, pork, lamb)
        - `gevogelte` — Poultry (chicken, turkey, duck)
        - `vis` — Fish & seafood
        - `vegetarisch` — Vegetarian (eggs, cheese, tofu)
        - `veganistisch` — Vegan (plant-based)
      enum: [vlees, gevogelte, vis, vegetarisch, veganistisch]
      example: "gevogelte"

    Base:
      type: string
      description: |
        Carbohydrate base of the recipe. Values are in Dutch.
        - `pasta` — Pasta (spaghetti, penne, noodles)
        - `rijst` — Rice (basmati, risotto)
        - `aardappel` — Potato (boiled, mashed, fries)
        - `brood` — Bread (bread, dough, wraps)
        - `geen` — None (salads, soups without carbs)
      enum: [pasta, rijst, aardappel, brood, geen]
      example: "rijst"

    DayType:
      type: string
      description: |
        Type of day planning.
        - `recipe` — Cooking day with a recipe
        - `hellofresh` — HelloFresh delivery day (no own recipe needed)
        - `not_home` — Not at home (skip)
      enum: [recipe, hellofresh, not_home]
      example: "recipe"

    InventoryItemType:
      type: string
      description: |
        Type of inventory item:
        - `houdbaar` — Shelf-stable (pasta, rice, cans, spices) — binary tracking
        - `vers_basis` — Fresh staple (milk, eggs, butter) — ordered weekly by default
      enum: [houdbaar, vers_basis]
      example: "houdbaar"

    CheckPriority:
      type: string
      description: Priority of a check suggestion.
      enum: [high, medium, low]
      example: "high"

    # -----------------------------------------------------------------------
    # Recipe
    # -----------------------------------------------------------------------

    Ingredient:
      type: object
      required: [ingredient_name, quantity, unit]
      properties:
        ingredient_name:
          type: string
          description: Name of the ingredient.
          example: "ui"
        quantity:
          type: number
          description: Amount (> 0).
          example: 2
        unit:
          type: string
          description: "Unit (gram, stuks, eetlepel, liter, naar smaak, etc.)."
          example: "stuks"
        note:
          type: string
          nullable: true
          description: "Optional note (e.g., 'finely chopped', 'duo pack')."
          example: "fijngesneden"

    Recipe:
      type: object
      description: A recipe with ingredients and metadata.
      required:
        - name
        - recipe_id
        - display_name
        - category
        - base
        - seasons
        - base_portions
        - ingredients
        - prep_time_minutes
      properties:
        name:
          type: string
          description: "Resource name. Format: `recipes/{recipe_id}`."
          readOnly: true
          example: "recipes/spaanse-rijstschotel-chorizo-kip"
        recipe_id:
          type: string
          description: Unique slug ID.
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          example: "spaanse-rijstschotel-chorizo-kip"
        display_name:
          type: string
          description: Display name of the recipe (max 100 chars).
          maxLength: 100
          example: "Spaanse rijstschotel met chorizo en kip"
        category:
          $ref: "#/components/schemas/Category"
        base:
          $ref: "#/components/schemas/Base"
        seasons:
          type: array
          description: Seasons in which the recipe fits.
          items:
            $ref: "#/components/schemas/Season"
          minItems: 1
          example: ["alle"]
        base_portions:
          type: integer
          description: Default number of portions (>= 1).
          minimum: 1
          example: 4
        ingredients:
          type: array
          description: Ingredients (scaled to base_portions).
          items:
            $ref: "#/components/schemas/Ingredient"
        tags:
          type: array
          description: Tags for filtering.
          items:
            type: string
          example: ["spaans", "kip"]
        prep_time_minutes:
          type: integer
          description: Preparation time in minutes.
          minimum: 1
          example: 25
        instructions:
          type: string
          nullable: true
          description: Cooking instructions.
          example: "1. Bring a large pot of water to a boil..."
        source:
          type: string
          nullable: true
          description: "Source (e.g., 'Cookbook p. 47', 'AH Allerhande')."
          example: "AH Allerhande Box"
        last_cooked:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: Date the recipe was last cooked.
          example: "2026-01-15"
        times_cooked:
          type: integer
          readOnly: true
          description: Number of times this recipe has been cooked.
          example: 5

    RecipeUpdate:
      type: object
      description: Fields to update on a recipe (merge semantics).
      properties:
        display_name:
          type: string
          maxLength: 100
        category:
          $ref: "#/components/schemas/Category"
        base:
          $ref: "#/components/schemas/Base"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"
        base_portions:
          type: integer
          minimum: 1
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        tags:
          type: array
          items:
            type: string
        prep_time_minutes:
          type: integer
          minimum: 1
        instructions:
          type: string
          nullable: true
        source:
          type: string
          nullable: true

    ListRecipesResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
        next_page_token:
          type: string
          description: Token for the next page (empty if no more pages).
        total_size:
          type: integer
          description: Total number of recipes (may be an estimate).

    # -----------------------------------------------------------------------
    # Menu
    # -----------------------------------------------------------------------

    MenuDaySummary:
      type: object
      description: Summary of a day planning (for menu overview).
      required: [day, day_label, date, type]
      properties:
        day:
          type: integer
          description: "Day of week (0=Mon, 6=Sun)."
          minimum: 0
          maximum: 6
          example: 0
        day_label:
          type: string
          description: Name of the weekday (in Dutch).
          example: "maandag"
        date:
          type: string
          format: date
          description: Date (YYYY-MM-DD).
          example: "2026-02-09"
        recipe_id:
          type: string
          nullable: true
          description: Recipe ID (null for HelloFresh/not home).
          example: "spaanse-rijstschotel-chorizo-kip"
        recipe_display_name:
          type: string
          nullable: true
          description: Recipe name.
          example: "Spaanse rijstschotel met chorizo en kip"
        recipe_category:
          $ref: "#/components/schemas/Category"
        recipe_base:
          $ref: "#/components/schemas/Base"
        portions:
          type: integer
          description: Number of portions (0 for HelloFresh/not home).
          example: 2
        type:
          $ref: "#/components/schemas/DayType"
        last_cooked:
          type: string
          format: date
          nullable: true
          description: When this recipe was last cooked.
          example: "2026-01-15"

    Menu:
      type: object
      description: A weekly menu with day plannings.
      required: [name, menu_id, week_start, status, days]
      properties:
        name:
          type: string
          description: "Resource name. Format: `menus/{menu_id}`."
          readOnly: true
          example: "menus/2026-W07"
        menu_id:
          type: string
          description: Menu ID (ISO week number).
          example: "2026-W07"
        week_start:
          type: string
          format: date
          description: Monday of the week.
          example: "2026-02-09"
        status:
          type: string
          enum: [draft, confirmed]
          description: |
            - `draft`: Working version, not yet confirmed.
            - `confirmed`: Confirmed and saved to history.
          example: "draft"
        season:
          $ref: "#/components/schemas/Season"
        days:
          type: array
          description: Day plannings (max 7).
          items:
            $ref: "#/components/schemas/MenuDaySummary"
          maxItems: 7

    MenuDay:
      type: object
      description: Full day planning with recipe details.
      required: [name, day, day_label, date, type, portions]
      properties:
        name:
          type: string
          description: "Resource name. Format: `menus/{menu_id}/days/{day}`."
          readOnly: true
          example: "menus/2026-W07/days/0"
        day:
          type: integer
          minimum: 0
          maximum: 6
          example: 0
        day_label:
          type: string
          example: "maandag"
        date:
          type: string
          format: date
          example: "2026-02-09"
        type:
          $ref: "#/components/schemas/DayType"
        portions:
          type: integer
          example: 2
        recipe:
          $ref: "#/components/schemas/Recipe"
          nullable: true
          description: Full recipe (null for HelloFresh/not home).
        last_cooked:
          type: string
          format: date
          nullable: true
          description: When this recipe was last cooked.

    GenerateMenuRequest:
      type: object
      required: [week_start, season, days]
      properties:
        week_start:
          type: string
          format: date
          description: Monday of the week (YYYY-MM-DD).
          example: "2026-02-09"
        season:
          $ref: "#/components/schemas/Season"
        days:
          type: array
          description: Configuration per day.
          items:
            type: object
            required: [day, type]
            properties:
              day:
                type: integer
                description: "Day of week (0=Mon, 6=Sun)."
                minimum: 0
                maximum: 6
              portions:
                type: integer
                description: Number of portions (required when type is `recipe`).
                minimum: 1
                maximum: 12
              type:
                $ref: "#/components/schemas/DayType"
          minItems: 1
          maxItems: 7

    UpdateMenuDayRequest:
      type: object
      properties:
        portions:
          type: integer
          minimum: 1
          maximum: 12
          description: New number of portions.
        type:
          $ref: "#/components/schemas/DayType"

    SetRecipeRequest:
      type: object
      required: [recipe_id]
      properties:
        recipe_id:
          type: string
          description: ID of the chosen recipe.
          example: "spaghetti-bolognese"
        portions:
          type: integer
          minimum: 1
          maximum: 12
          description: Optional new number of portions.

    ListMenusResponse:
      type: object
      properties:
        menus:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
        next_page_token:
          type: string
        total_size:
          type: integer

    # -----------------------------------------------------------------------
    # Inventory
    # -----------------------------------------------------------------------

    InventoryItem:
      type: object
      required: [name, item_name, type, in_stock, last_checked]
      properties:
        name:
          type: string
          description: "Resource name. Format: `inventory/items/{item_name}`."
          readOnly: true
          example: "inventory/items/pasta"
        item_name:
          type: string
          description: Normalized ingredient name.
          example: "pasta"
        type:
          $ref: "#/components/schemas/InventoryItemType"
        in_stock:
          type: boolean
          description: True if the item is in stock.
          example: true
        last_checked:
          type: string
          format: date
          description: Date of last check (YYYY-MM-DD).
          example: "2026-02-07"

    CreateInventoryItemRequest:
      type: object
      required: [item_name, type]
      properties:
        item_name:
          type: string
          example: "kokosmelk"
        type:
          $ref: "#/components/schemas/InventoryItemType"
        in_stock:
          type: boolean
          default: false
          example: true

    UpdateInventoryItemRequest:
      type: object
      properties:
        in_stock:
          type: boolean
        type:
          $ref: "#/components/schemas/InventoryItemType"

    ListInventoryItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        next_page_token:
          type: string
        total_size:
          type: integer

    CheckSuggestion:
      type: object
      description: Suggestion to check an inventory item.
      required: [item_name, reason, priority, type]
      properties:
        item_name:
          type: string
          description: Ingredient name.
          example: "passata"
        reason:
          type: string
          description: Why this suggestion (for display).
          example: "Used in weekly menu"
        priority:
          $ref: "#/components/schemas/CheckPriority"
        type:
          $ref: "#/components/schemas/InventoryItemType"
        current_status:
          type: boolean
          nullable: true
          description: Current stock status (null if unknown).
          example: true
        used_in_recipes:
          type: array
          description: Recipes in which this ingredient is used.
          items:
            type: string
          example: ["Italiaanse runderstoof met pompoen"]

    GenerateChecksRequest:
      type: object
      required: [menu_id, season]
      properties:
        menu_id:
          type: string
          description: Menu ID to generate checks for.
          example: "2026-W07"
        season:
          $ref: "#/components/schemas/Season"

    GenerateChecksResponse:
      type: object
      properties:
        checks:
          type: array
          description: "Sorted: high > medium > low, then alphabetically."
          items:
            $ref: "#/components/schemas/CheckSuggestion"
        total_size:
          type: integer
          example: 7

    BatchUpdateInventoryRequest:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          description: List of items to update.
          items:
            type: object
            required: [item_name, in_stock]
            properties:
              item_name:
                type: string
                example: "melk"
              in_stock:
                type: boolean
                example: true
          minItems: 1

    BatchUpdateInventoryResponse:
      type: object
      properties:
        updated_items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        total_updated:
          type: integer
          example: 6

    # -----------------------------------------------------------------------
    # Shopping Lists
    # -----------------------------------------------------------------------

    ShoppingListItem:
      type: object
      required: [item_id, ingredient_name, quantity, unit, checked]
      properties:
        item_id:
          type: string
          description: Unique item ID.
          example: "item-001"
        ingredient_name:
          type: string
          description: Normalized ingredient name.
          example: "rundergehakt"
        quantity:
          type: number
          description: Amount (rounded to logical packaging sizes).
          example: 500
        unit:
          type: string
          description: Unit.
          example: "gram"
        checked:
          type: boolean
          description: True if item is checked off (already at home).
          example: false
        source_recipes:
          type: array
          description: Recipes this ingredient comes from.
          items:
            type: string
          example: ["Penne met gehaktballetjes"]
        note:
          type: string
          nullable: true
          description: "Optional note (e.g., 'Weekly staple', 'Manually added')."
          example: null

    ShoppingListSection:
      type: object
      required: [section_name, items]
      properties:
        section_name:
          type: string
          description: "Section name (e.g., 'Meat & fish', 'Dairy')."
          example: "Meat & fish"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingListItem"

    ShoppingList:
      type: object
      required: [name, list_id, week_start, status, sections, total_items]
      properties:
        name:
          type: string
          description: "Resource name. Format: `shoppingLists/{list_id}`."
          readOnly: true
          example: "shoppingLists/2026-W07"
        list_id:
          type: string
          example: "2026-W07"
        week_start:
          type: string
          format: date
          example: "2026-02-09"
        status:
          type: string
          enum: [draft, sent_to_ah]
          example: "draft"
        create_time:
          type: string
          format: date-time
          readOnly: true
          example: "2026-02-14T19:30:00Z"
        sections:
          type: array
          description: Grouped items by product category.
          items:
            $ref: "#/components/schemas/ShoppingListSection"
        total_items:
          type: integer
          description: Total number of items on the list.
          example: 23

    GenerateShoppingListRequest:
      type: object
      required: [menu_id]
      properties:
        menu_id:
          type: string
          description: Menu ID to generate the shopping list from.
          example: "2026-W07"
        include_fresh_basics:
          type: boolean
          description: |
            If true, fresh staple products that are out of stock
            are automatically added.
          default: true
          example: true

    AddShoppingListItemRequest:
      type: object
      required: [ingredient_name, quantity, unit]
      properties:
        ingredient_name:
          type: string
          example: "avocado"
        quantity:
          type: number
          example: 2
        unit:
          type: string
          example: "stuks"

    UpdateShoppingListItemRequest:
      type: object
      properties:
        quantity:
          type: number
          description: New quantity.
        checked:
          type: boolean
          description: Checked off (true = already at home).

    ListShoppingListsResponse:
      type: object
      properties:
        shopping_lists:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "shoppingLists/2026-W07"
              list_id:
                type: string
                example: "2026-W07"
              week_start:
                type: string
                format: date
                example: "2026-02-09"
              total_items:
                type: integer
                example: 23
              status:
                type: string
                enum: [draft, sent_to_ah]
                example: "draft"
              create_time:
                type: string
                format: date-time
                example: "2026-02-14T19:30:00Z"
        next_page_token:
          type: string
        total_size:
          type: integer

    # -----------------------------------------------------------------------
    # AH Integration
    # -----------------------------------------------------------------------

    AHLoginRequest:
      type: object
      required: [authorization_code]
      properties:
        authorization_code:
          type: string
          description: OAuth2 authorization code from the redirect URL.
          example: "abc123def456"

    AHLoginResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          example: true
        expires_at:
          type: string
          format: date-time
          description: Expiry time of the access token.
          example: "2026-02-14T21:30:00Z"
        message:
          type: string
          example: "Login successful. Tokens saved."

    AHStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          example: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-02-14T21:30:00Z"
        login_url:
          type: string
          nullable: true
          description: Login URL (only when not logged in).

    AHProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 11111
        title:
          type: string
          example: "AH Spaghetti"
        brand:
          type: string
          example: "AH"
        size:
          type: string
          example: "500 g"
        price:
          type: number
          format: double
          example: 0.89
        category:
          type: string
          example: "Pasta, rijst en wereldkeuken"
        is_orderable:
          type: boolean
          example: true

    SearchAHProductsRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Search term.
          example: "spaghetti"
        reference_list_id:
          type: string
          nullable: true
          description: |
            Optional: AH list ID to search in first
            (for product matching with previously ordered products).
        limit:
          type: integer
          default: 10
          maximum: 50
          description: Maximum number of results.

    SearchAHProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/AHProduct"
        total_size:
          type: integer

    AHList:
      type: object
      properties:
        list_id:
          type: string
          example: "ah-list-789"
        name:
          type: string
          example: "Week 7 groceries"
        total_items:
          type: integer
          example: 0

    AHListWithProducts:
      type: object
      properties:
        list_id:
          type: string
          example: "ah-list-123"
        name:
          type: string
          example: "Week 6 groceries"
        total_items:
          type: integer
          example: 3
        products:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AHProduct"
              - type: object
                properties:
                  quantity:
                    type: integer
                    example: 1

    CreateAHListRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Week 7 groceries"

    ListAHListsResponse:
      type: object
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/AHList"
        total_size:
          type: integer

    SendToAHRequest:
      type: object
      properties:
        ah_list_name:
          type: string
          description: Name for the new AH list. Default "Week X groceries".
          example: "Week 7 groceries"
        reference_list_id:
          type: string
          nullable: true
          description: AH list with previously ordered products (for better matching).
          example: "ah-list-456"

    SendToAHResultItem:
      type: object
      properties:
        ingredient_name:
          type: string
          example: "runderstoofvlees"
        status:
          type: string
          enum: [matched, not_found]
          example: "matched"
        source:
          type: string
          enum: [reference, search, none]
          description: |
            - `reference`: Found in reference list
            - `search`: Found via AH search API
            - `none`: Not found
          example: "search"
        ah_product:
          $ref: "#/components/schemas/AHProduct"
          nullable: true
        quantity:
          type: integer
          description: Quantity ordered.
          example: 1

    SendToAHResponse:
      type: object
      properties:
        ah_list_id:
          type: string
          description: ID of the created AH list.
          example: "new-ah-list-id-456"
        ah_list_name:
          type: string
          example: "Week 7 groceries"
        total_items:
          type: integer
          description: Total number of items on the shopping list.
          example: 23
        matched:
          type: integer
          description: Number of successfully matched items.
          example: 21
        not_found:
          type: integer
          description: Number of items for which no AH product was found.
          example: 2
        results:
          type: array
          items:
            $ref: "#/components/schemas/SendToAHResultItem"

    # -----------------------------------------------------------------------
    # Today
    # -----------------------------------------------------------------------

    TodayResponse:
      type: object
      required: [date, day_label, has_recipe]
      properties:
        date:
          type: string
          format: date
          description: The requested date.
          example: "2026-02-14"
        day_label:
          type: string
          description: Name of the weekday (in Dutch).
          example: "zaterdag"
        has_recipe:
          type: boolean
          description: True if a recipe is planned.
          example: true
        menu_id:
          type: string
          nullable: true
          description: The menu ID (null if no menu for this week).
          example: "2026-W07"
        day:
          $ref: "#/components/schemas/MenuDay"
          nullable: true
          description: The full day planning (null if no menu).
        previous_date:
          type: string
          format: date
          description: The previous day (for navigation).
          example: "2026-02-13"
        next_date:
          type: string
          format: date
          description: The next day (for navigation).
          example: "2026-02-15"

    # -----------------------------------------------------------------------
    # Settings
    # -----------------------------------------------------------------------

    FreshBasicItem:
      type: object
      required: [ingredient_name, quantity, unit]
      properties:
        ingredient_name:
          type: string
          example: "melk"
        quantity:
          type: number
          example: 1
        unit:
          type: string
          example: "liter"

    Settings:
      type: object
      properties:
        name:
          type: string
          readOnly: true
          example: "settings"
        hellofresh_days:
          type: array
          description: "Weekdays with HelloFresh delivery (0=Mon, 6=Sun)."
          items:
            type: integer
            minimum: 0
            maximum: 6
          example: [1, 2, 3]
        default_portions:
          type: object
          description: Default number of portions per day type.
          properties:
            weekday:
              type: integer
              description: Portions on weekdays (Mon-Fri).
              example: 2
            weekend:
              type: integer
              description: Portions on weekends (Sat-Sun).
              example: 4
        fresh_basics:
          type: array
          description: Fresh staple products for the weekly shopping list.
          items:
            $ref: "#/components/schemas/FreshBasicItem"
        recent_weeks_exclusion:
          type: integer
          description: Number of weeks back for "recently cooked" exclusion.
          default: 3
          example: 3
        ah_reference_list_id:
          type: string
          nullable: true
          description: AH list used as reference for product matching.
          example: "ah-list-456"

    SettingsUpdate:
      type: object
      description: Fields to update (merge semantics).
      properties:
        hellofresh_days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        default_portions:
          type: object
          properties:
            weekday:
              type: integer
            weekend:
              type: integer
        fresh_basics:
          type: array
          items:
            $ref: "#/components/schemas/FreshBasicItem"
        recent_weeks_exclusion:
          type: integer
          minimum: 1
        ah_reference_list_id:
          type: string
          nullable: true

    # -----------------------------------------------------------------------
    # Error
    # -----------------------------------------------------------------------

    Error:
      type: object
      description: Error response per Google API conventions.
      required: [code, status, message]
      properties:
        code:
          type: integer
          description: HTTP status code.
          example: 404
        status:
          type: string
          description: |
            Google API error code:
            - `INVALID_ARGUMENT` (400)
            - `UNAUTHENTICATED` (401)
            - `NOT_FOUND` (404)
            - `ALREADY_EXISTS` (409)
            - `INTERNAL` (500)
          example: "NOT_FOUND"
        message:
          type: string
          description: Human-readable error description.
          example: "The requested resource does not exist."
        details:
          type: array
          description: Optional additional error details.
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that caused the error.
                example: "recipe_id"
              description:
                type: string
                description: Description of the problem.
                example: "Recipe not found with ID: unknown-recipe"
