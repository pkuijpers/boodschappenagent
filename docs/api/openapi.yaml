                    last_checked: "2026-02-07"
                  - name: "inventory/items/eieren"
                    item_name: "eieren"
                    type: "vers_basis"
                    in_stock: false
                    last_checked: "2026-02-07"
                  - name: "inventory/items/pasta"
                    item_name: "pasta"
                    type: "houdbaar"
                    in_stock: true
                    last_checked: "2026-02-01"
                  - name: "inventory/items/passata"
                    item_name: "passata"
                    type: "houdbaar"
                    in_stock: true
