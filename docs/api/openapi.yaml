          description: List of shopping lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListShoppingListsResponse"
              example:
                shopping_lists:
                  - name: "shoppingLists/2026-W07"
                    list_id: "2026-W07"
                    week_start: "2026-02-09"
                    total_items: 23
                    status: "draft"
                    create_time: "2026-02-14T19:30:00Z"
                next_page_token: ""
                total_size: 1

  /shoppingLists:generate:
    post:
      operationId: generateShoppingList
      summary: Generate a shopping list
      description: |
        Generates a shopping list based on:
        1. Ingredients from the weekly menu (scaled to portions)
        2. Fresh staple products that are out of stock
        3. Shelf-stable products that are out of stock

        Ingredients are:
        - Normalized (synonyms, units)
        - Aggregated (e.g., "2x 200g ground beef" becomes "400g ground beef")
        - Rounded to logical packaging sizes
        - Filtered by inventory status
      tags: [Shopping Lists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateShoppingListRequest"
            example:
              menu_id: "2026-W07"
              include_fresh_basics: true
      responses:
        "200":
          description: The generated shopping list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
              example:
                name: "shoppingLists/2026-W07"
                list_id: "2026-W07"
                week_start: "2026-02-09"
                status: "draft"
                create_time: "2026-02-14T19:30:00Z"
                sections:
                  - section_name: "Meat & fish"
                    items:
                      - item_id: "item-001"
                        ingredient_name: "runderstoofvlees"
                        quantity: 300
                        unit: "gram"
                        checked: false
                        source_recipes: ["Italiaanse runderstoof met pompoen"]
                      - item_id: "item-002"
                        ingredient_name: "rundergehakt"
                        quantity: 250
                        unit: "gram"
                        checked: false
                        source_recipes: ["Penne met gehaktballetjes"]
                      - item_id: "item-003"
                        ingredient_name: "kipfilet"
                        quantity: 400
                        unit: "gram"
                        checked: false
                        source_recipes: ["Thaise roerbak met kip"]
                  - section_name: "Dairy"
                    items:
                      - item_id: "item-010"
                        ingredient_name: "eieren"
                        quantity: 6
                        unit: "stuks"
                        checked: false
                        source_recipes: []
                        note: "Weekly staple"
                  - section_name: "Produce"
                    items:
                      - item_id: "item-020"
                        ingredient_name: "pompoen"
                        quantity: 300
                        unit: "gram"
                        checked: false
                        source_recipes: ["Italiaanse runderstoof met pompoen"]
                      - item_id: "item-021"
                        ingredient_name: "ui"
                        quantity: 4
                        unit: "stuks"
                        checked: false
                        source_recipes:
                          - "Italiaanse runderstoof met pompoen"
                          - "Penne met gehaktballetjes"
                          - "Thaise roerbak met kip"
                  - section_name: "Shelf-stable"
                    items:
                      - item_id: "item-030"
                        ingredient_name: "rijst"
                        quantity: 500
                        unit: "gram"
                        checked: false
