<div data-testid="boodschappen-header"
     class="px-4 mb-2">
    <p class="text-gray-500 text-sm">Week {{ week_nr }} · {{ totaal }} product{{ 'en' if totaal != 1 else '' }}</p>
</div>

{% if items %}
<section data-testid="boodschappen-sectie" class="mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-2 px-4">Boodschappen</h2>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mx-4">
        <div class="px-4">
            {% for item in items %}
                {% include "components/boodschapitem.html" %}
            {% endfor %}
        </div>
    </div>
</section>
{% else %}
<div data-testid="lege-lijst" class="mx-4 py-12 text-center">
    <p class="text-4xl mb-3">🎉</p>
    <p class="text-gray-700 font-semibold text-lg">Niets te bestellen!</p>
    <p class="text-gray-400 text-sm mt-1">Alles staat al op voorraad.</p>
</div>
{% endif %}

<div class="px-4 mb-8">
    <button data-testid="verstuur-naar-ah-button"
            class="block w-full text-center py-3 px-4 bg-ah-blue text-white font-semibold rounded-lg hover:bg-ah-blue-dark transition-colors">
        Verstuur naar AH →
    </button>
</div>
