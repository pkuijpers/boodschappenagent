<div data-testid="boodschappen-header"
     class="px-4 mb-2">
    <p class="text-gray-500 text-sm">Week {{ week_nr }} · {{ totaal }} product{{ 'en' if totaal != 1 else '' }}</p>
</div>

{% if items %}
<section data-testid="boodschappen-sectie" class="mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-2 px-4">Boodschappen</h2>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mx-4">
        <div class="px-4">
            {% for item in items %}
                {% include "components/boodschapitem.html" %}
            {% endfor %}
        </div>
    </div>
</section>
{% else %}
<div data-testid="lege-lijst" class="mx-4 py-12 text-center">
    <p class="text-4xl mb-3">🎉</p>
    <p class="text-gray-700 font-semibold text-lg">Niets te bestellen!</p>
    <p class="text-gray-400 text-sm mt-1">Alles staat al op voorraad.</p>
</div>
{% endif %}

<div class="px-4 mb-4">
    <details class="group">
        <summary data-testid="voeg-toe-button"
                 class="cursor-pointer list-none flex items-center gap-2 py-2 text-ah-blue font-medium text-sm select-none">
            <span class="text-lg leading-none">+</span>
            Voeg product toe
        </summary>
        <div class="mt-3 bg-white rounded-xl border border-gray-100 shadow-sm p-4">
            <form hx-post="/boodschappen/toevoegen"
                  hx-target="#handmatig-toegevoegd-items"
                  hx-swap="beforeend"
                  class="flex flex-col gap-2">
                <input data-testid="voeg-toe-naam"
                       name="naam"
                       type="text"
                       placeholder="Productnaam"
                       required
                       class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-ah-blue">
                <div class="flex gap-2">
                    <input name="hoeveelheid"
                           type="number"
                           value="1"
                           min="0.5"
                           step="0.5"
                           class="w-20 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-ah-blue">
                    <input name="eenheid"
                           type="text"
                           value="stuks"
                           placeholder="eenheid"
                           class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-ah-blue">
                </div>
                <button data-testid="voeg-toe-submit"
                        type="submit"
                        class="w-full py-2 bg-ah-blue text-white font-medium rounded-lg text-sm hover:bg-ah-blue-dark transition-colors">
                    Toevoegen
                </button>
            </form>
        </div>
    </details>
</div>

<div id="handmatig-toegevoegd-items" class="mx-4"></div>

<div class="px-4 mb-8">
    <button data-testid="verstuur-naar-ah-button"
            class="block w-full text-center py-3 px-4 bg-ah-blue text-white font-semibold rounded-lg hover:bg-ah-blue-dark transition-colors">
        Verstuur naar AH →
    </button>
</div>
