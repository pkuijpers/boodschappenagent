<div data-testid="ah-login-form" class="px-4">
    <div class="bg-ah-blue-light rounded-xl p-4 mb-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">Inloggen bij Albert Heijn</h2>
        <p class="text-sm text-gray-600 mb-3">
            Open de onderstaande link, log in met je AH-account en kopieer de code uit de URL.
        </p>
        <a data-testid="ah-login-url"
           href="{{ login_url }}"
           target="_blank"
           rel="noopener"
           class="text-ah-blue font-medium text-sm underline break-all">
            login.ah.nl
        </a>
    </div>

    {% if error %}
    <div data-testid="ah-login-error" class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-4 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/ah/login" class="space-y-4">
        <div>
            <label for="code" class="block text-sm font-medium text-gray-700 mb-1">Authorization code</label>
            <input type="text"
                   name="code"
                   id="code"
                   placeholder="Plak hier de code uit de URL"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-ah-blue focus:border-ah-blue"
                   required>
        </div>
        <button data-testid="ah-login-submit"
                type="submit"
                class="w-full py-3 bg-ah-blue text-white font-semibold rounded-xl hover:bg-ah-blue-dark transition-colors">
            Inloggen
        </button>
    </form>
</div>
