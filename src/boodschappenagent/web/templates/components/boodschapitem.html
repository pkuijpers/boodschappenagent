{% set next_checked = 'false' if item.checked else 'true' %}
<div data-testid="boodschapitem"
     data-item="{{ item.naam }}"
     data-checked="{{ 'true' if item.checked else 'false' }}"
     id="boodschapitem-{{ item.id }}"
     class="flex items-center py-3 border-b border-gray-100 last:border-0 gap-3">

    <button type="button"
            hx-patch="/boodschappen/{{ item.id }}"
            hx-vals='{"checked": "{{ next_checked }}"}'
            hx-target="#boodschapitem-{{ item.id }}"
            hx-swap="outerHTML"
            class="w-5 h-5 rounded border-2 shrink-0 cursor-pointer
                   {{ 'bg-ah-blue border-ah-blue' if item.checked else 'border-gray-300' }}
                   flex items-center justify-center">
        {% if item.checked %}
        <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
        </svg>
        {% endif %}
    </button>

    <div class="flex-1 min-w-0">
        <span class="font-medium capitalize {{ 'text-gray-400 line-through' if item.checked else 'text-gray-800' }}">
            {{ item.naam }}
        </span>
    </div>

    <span class="text-sm text-gray-500 shrink-0 flex items-center gap-1">
        <input type="number"
               name="hoeveelheid"
               value="{{ item.hoeveelheid|int if item.hoeveelheid == item.hoeveelheid|int else item.hoeveelheid }}"
               min="0.5"
               step="0.5"
               data-testid="hoeveelheid"
               hx-patch="/boodschappen/{{ item.id }}/hoeveelheid"
               hx-target="#boodschapitem-{{ item.id }}"
               hx-swap="outerHTML"
               hx-trigger="change"
               class="w-12 text-right bg-transparent border-b border-transparent
                      hover:border-gray-300 focus:border-ah-blue focus:outline-none
                      text-sm text-gray-500"/>
        {{ item.eenheid }}
    </span>
</div>
