<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Albert{% endblock %}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ah: {
                            blue: '#00A0E2',
                            'blue-dark': '#0077B3',
                            'blue-light': '#E6F4FA',
                            orange: '#FF6B00',
                            green: '#4CAF50',
                        },
                        hf: {
                            bg: '#FFF7F0',
                            border: '#FFD6B0',
                            text: '#C0854A',
                        },
                        muted: {
                            bg: '#F5F5F5',
                        },
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        @keyframes verstuur-shimmer {
            0%   { transform: translateX(-100%) skewX(-12deg); }
            100% { transform: translateX(250%) skewX(-12deg); }
        }
        .verstuur-btn.is-loading .verstuur-shimmer {
            opacity: 1;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
            animation: verstuur-shimmer 1.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col" hx-boost="true">

    <!-- Main content -->
    <main class="flex-1 pb-20">
        {% block content %}{% endblock %}
    </main>

    <!-- Tab bar -->
    {% include "components/tab_bar.html" %}

    <!-- Sheet backdrop -->
    <div id="sheet-backdrop"
         class="hidden fixed inset-0 bg-black/40 z-40"
         onclick="htmx.trigger(document.body, 'closeSheet')">
    </div>

    <!-- Sheet -->
    <div id="sheet"
         class="fixed inset-x-0 bottom-0 z-50 bg-white rounded-t-2xl shadow-2xl max-h-[85vh] overflow-y-auto translate-y-full transition-transform duration-300">
    </div>

    <script>
        document.body.addEventListener('htmx:afterSettle', function(evt) {
            if (evt.detail.target && evt.detail.target.id === 'sheet') {
                var sheet = document.getElementById('sheet');
                var backdrop = document.getElementById('sheet-backdrop');
                if (sheet && sheet.children.length > 0) {
                    sheet.classList.remove('translate-y-full');
                    backdrop.classList.remove('hidden');
                }
            }
        });
        document.body.addEventListener('closeSheet', function() {
            var sheet = document.getElementById('sheet');
            var backdrop = document.getElementById('sheet-backdrop');
            if (sheet) {
                sheet.classList.add('translate-y-full');
                sheet.innerHTML = '';
            }
            if (backdrop) {
                backdrop.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
